[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topix"
version = "0.3.93"
description = "Learn - Note - Share with AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.13",
    "bcrypt>=4.3.0",
    "cloudscraper==1.2.71",
    "daytona==0.151.0",
    "doppler-sdk>=1.3.0",
    "igraph>=1.0.0",
    "fastapi==0.128.0",
    "google-auth>=2.40.3",
    "jinja2>=3.1.6",
    "linkpreview==0.11.0",
    "litellm>=1.83.14",
    "lxml==6.0.0",
    "mistralai==1.12.4",
    "openai==2.34.0",
    "openai-agents==0.15.1",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.12.4",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "qdrant-client==1.17.0",
    "questionary>=1.7.0",
    "readchar>=4.2.1",
    "redis>=5.2.1",
    "rich>=13.7.1",
    "selectolax>=0.3.34",
    "tiktoken>=0.12,<0.13",
    "httpx>=0.28.1",
    "pypdf>=6.3.0",
    "uvicorn==0.41.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.3.1",
    "flake8>=7.3.0",
    "ruff>=0.12.2",
    "black>=25.1.0",
    "datasets>=3.6.0",
    "fakeredis>=2.26.0",
]

[tool.uv]
# litellm 1.83.x over-pins openai==2.24.0 in its metadata, which conflicts with
# openai-agents>=0.15.1's openai>=2.26.0 requirement. Runtime is fine — both
# packages work together with the newer openai client. Override the lockfile
# resolver so uv lock can succeed.
override-dependencies = [
    "openai>=2.34.0,<3",
]

[tool.ruff]
lint.select = [
  "I",     # isort
  "F",     # pyflakes
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "C90",   # mccabe
  "C4",    # flake8-comprehensions
  # "B",     # flake8-bugbear
  # "UP",    # pyupgrade
  # "SIM",   # flake8-simplify
  "ERA",   # eradicate
  "D",     # pydocstyle
  "N"      # pep8-naming
]

lint.ignore = [
  "D203",  # Exclude 'incorrect-blank-line-before-class'
  "D213"   # Exclude 'multi-line-summary-second-line'
]
line-length = 150

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.setuptools.packages.find]
exclude = ["build", "test"]

[tool.pytest.ini_options]
# Safety net: no single unit test should run this long. The collab
# WebSocket tests drive real sessions through Starlette's TestClient
# with blocking, un-timed `receive_*()` calls; a rare cross-peer
# frame-ordering race would otherwise wedge a test — and the whole CI
# job — indefinitely. Turning a hang into a per-test failure surfaces
# the exact blocked receive instead. `thread` can interrupt a blocked
# C-level queue.get (the default `signal` method can't, on a worker).
timeout = 30
timeout_method = "thread"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "datasets>=3.6.0",
    "fakeredis>=2.26.0",
    "flake8>=7.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.12.2",
]
