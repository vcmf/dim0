name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump to apply
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major


permissions:
  contents: write
  pull-requests: read


# Serialize release runs so two dispatches can't race to bump/tag/push main at once.
concurrency:
  group: release
  cancel-in-progress: false


jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Do NOT persist the GITHUB_TOKEN credential. Checkout otherwise writes an
          # http.extraheader for github.com that every later `git push` sends, and that
          # header OVERRIDES the token embedded in a push URL — so the release push would
          # silently authenticate as github-actions[bot] (which can't bypass the ruleset)
          # instead of the admin PAT, giving GH013. With this off, each push below carries
          # its own explicit credential.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, sync manifests, and tag
        run: |
          # cz bump updates every manifest listed in .cz.toml's version_files
          # (VERSION + backend/webui/tauri) and creates the commit + tag in one
          # step, so the tag points at a tree where all manifests already match.
          uv run --with commitizen cz bump --increment "${{ inputs.bump }}" --yes
          # Guard: fail the release if any tracked manifest drifted from VERSION
          # (e.g. sync_version.py grew a manifest that version_files didn't).
          python3 scripts/sync_version.py --check

      - name: Push release commit and tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set — needed to push the release commit to main (bypasses the branch ruleset). See .github/workflows/release.yml." >&2
            exit 1
          fi
          VERSION="$(cat VERSION)"
          REPO="${{ github.repository }}"
          # Push the version-bump commit to main with an ADMIN PAT so it bypasses main's
          # required-status-checks ruleset. A fresh release commit has never run the PR checks,
          # and GITHUB_TOKEN (github-actions[bot]) can't be a ruleset bypass actor — so its
          # push is rejected (GH013). RELEASE_TOKEN is a CLASSIC PAT (scope `repo`) owned by a
          # repo+org admin whose identity IS in the ruleset's admin bypass.
          #
          # The PAT goes in the USERNAME slot (not `x-access-token:`). `x-access-token` is
          # GitHub's reserved username for App installation tokens; using it makes the git
          # backend resolve the pusher as an App/bot actor, which does NOT match the ruleset's
          # user-role bypass — so the admin bypass would silently not apply. As the username,
          # the PAT resolves to its owning user and the bypass applies. Secrets are auto-masked.
          git push "https://${RELEASE_TOKEN}@github.com/${REPO}.git" HEAD:main
          # Tag push stays on GITHUB_TOKEN on purpose: a GITHUB_TOKEN-pushed tag does NOT fire
          # `push: tags`, so desktop-release runs only via the ordered workflow_call below (no
          # double build, no race with "Create GitHub release"). `x-access-token` is the correct
          # username for GITHUB_TOKEN. Explicit URL because persist-credentials is off.
          git push "https://x-access-token:${GH_ACTIONS_TOKEN}@github.com/${REPO}.git" "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          gh release create "v${VERSION}" --generate-notes

      - name: Save version for downstream jobs
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.version }}

  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: refs/tags/v${{ needs.release.outputs.version }}
      push_latest: true
    secrets: inherit

  # Build + attach the desktop installers. Called directly (not via the tag event)
  # because the release tag is pushed with GITHUB_TOKEN, which does not fire
  # `push: tags` in other workflows.
  desktop:
    needs: release
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
